<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Apunta't · Xlumni</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="signup">

  <main class="signup">

    <div class="signup__card">

      <h1 class="signup__title">Crea un compte</h1>
      <p class="signup__subtitle">Uneix-te a nosaltres per connectar-te i compartir oportunitats!</p>

      <form id="signupForm" class="signup__form">

        <!-- Nom -->
        <div class="signup__field">
          <span class="signup__icon">&#128100;</span>
          <input id="name" name="name" type="text" placeholder="Posa el teu nom" required>
        </div>

        <!-- Cognom -->
        <div class="signup__field">
          <span class="signup__icon">&#128100;</span>
          <input id="surname" name="surname" type="text" placeholder="Posa el teu cognom" required>
        </div>

        <!-- Email -->
        <div class="signup__field">
          <span class="signup__icon">&#9993;</span>
          <input id="email" name="email" type="email" placeholder="El teu correu electrònic" required>
        </div>

        <!-- Contrasenya -->
        <div class="signup__field">
          <span class="signup__icon">&#128274;</span>
          <input id="password" name="password" type="password" placeholder="Crea una contrasenya" required>
        </div>

        <!-- Checkbox -->
        <label class="signup__checkbox">
          <input type="checkbox" id="agree" required>
          <span>Accepto els <a href="#">Termes i Condicions</a></span>
        </label>

        <!-- Botó principal -->
        <button type="submit" class="signup__submit">Registra't</button>

        <!-- Separador -->
        <div class="signup__divider">
          <span>o</span>
        </div>

        <!-- Botons socials -->
        <button type="button" class="signup__social signup__social--apple">
          <span>&#63743;</span> Continua amb Apple
        </button>

        <button type="button" class="signup__social signup__social--google">
          <span>G</span> Continua amb Google
        </button>

        <button type="button" class="signup__social signup__social--facebook">
          <span>f</span> Continua amb Facebook
        </button>

      </form>

      <p class="signup__footer">
        Ja t'has registrat? <a href="#">Inicia sessió</a>
      </p>

    </div>

  </main>

  <div id="toast" class="toast">Inscrit correctament</div>

  <script src="data/mockData.js"></script>
  <script src="scripts/Utils.js"></script>
  <script src="scripts/App.js"></script>

</body>
</html>
