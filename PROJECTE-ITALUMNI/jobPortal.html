<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="jobs">

  <div class="l-app-page">

    <!-- ============ HEADER · NOMÉS MÒBIL ============ -->
    <header class="mobile-header">
      <a href="home.html" class="mobile-header__back" aria-label="Enrere">&#8592;</a>
      <h1 class="mobile-header__title">Job Portal</h1>
      <div class="mobile-header__actions">
        <span class="mobile-header__chart">&#128202;</span>
        <a href="signup.html" class="mobile-header__avatar" aria-label="Perfil">
<img src="https://i.pravatar.cc/80?img=5" alt="Perfil">         </a>
      </div>
    </header>

    <!-- ============ NAVBAR DESKTOP ============ -->
    <header class="navbar navbar--desktop">
      <a href="home.html" class="navbar__brand">
        <span class="brand__mark">X</span>LLUMNI
      </a>

      <nav class="navbar__menu navbar__menu--inline">
        <a href="home.html" class="navbar__link" data-page="home">Home</a>
        <a href="networking.html" class="navbar__link" data-page="networking">Networking</a>
        <a href="jobPortal.html" class="navbar__link is-active" data-page="jobs">Job Opportunities</a>
      </nav>

      <div class="navbar__actions">
        <button class="navbar__icon-btn" aria-label="Cerca">&#128269;</button>
        <button class="navbar__icon-btn" aria-label="Notificacions">&#128276;</button>
        <a href="signup.html" class="navbar__avatar" aria-label="Perfil">
<img src="https://i.pravatar.cc/80?img=5" alt="Perfil">         </a>
      </div>
    </header>

    <!-- ============ CONTINGUT ============ -->
    <main class="jobs">

      <h1 class="jobs__title">Jobs</h1>

      <!-- CERCADOR -->
      <div class="jobs__search">
        <span class="jobs__search-icon">&#128269;</span>
        <input type="search" id="search" placeholder="Search alumni..." class="jobs__search-input">
      </div>

      <!-- FILTRES MÒBIL -->
      <div class="jobs__filters-mobile">
        <button type="button" class="jobs__filter-mobile">
          <span class="jobs__filter-arrow">&#9662;</span>
          Industry
        </button>
        <button type="button" class="jobs__filter-mobile">
          <span class="jobs__filter-arrow">&#9662;</span>
          Experience Level
        </button>
      </div>

      <!-- GRAELLA DE FEINES -->
      <div id="list" class="jobs__grid"></div>

    </main>

    <!-- ============ BOTTOM NAV · NOMÉS MÒBIL ============ -->
    <nav class="bottom-nav">
      <a href="home.html" class="bottom-nav__item">
        <span class="bottom-nav__icon">&#127968;</span>
        Home
      </a>
      <a href="networking.html" class="bottom-nav__item">
        <span class="bottom-nav__icon">&#128101;</span>
        Networking
      </a>
      <a href="jobPortal.html" class="bottom-nav__item is-active">
        <span class="bottom-nav__icon">&#128188;</span>
        Job Portal
      </a>
      <a href="signup.html" class="bottom-nav__item">
        <span class="bottom-nav__icon">&#128100;</span>
        Profile
      </a>
    </nav>
